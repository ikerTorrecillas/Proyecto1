<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Cartero Invisible</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="contenidorPrincipal">
    <header>
      <h1 id="titolPrincipal">El Cartero Invisible</h1>
      <h3 class="info">Bienvenido a tu buzón virtual</h3>
    </header>

    <form id="formCarta">
      <input type="text" id="remitent" placeholder="Tu Nombre" required>
      <input type="text" id="destinatari" placeholder="A quien va dirigida" required>
      <textarea id="contingut" placeholder="Escribe tu carta" required></textarea>
      <button id="btnForm" type="submit">Enviar carta</button>
    </form>

    <div id="contenidorCartes">
      <div class="carta">
        <h3>De: Iker</h3>
        <p>Hola que tal? Soy tu yo del pasado, vengo a atormentarte.</p>
      </div>
    </div>

    <main>
      <div id="buzon">
        <span role="img">📮</span>
      </div>
      <section id="llistatCartes">
        <!-- de moment buit: aquí aniran les cartes -->
      </section>
      <section id="formulariCarta">
        <!-- de moment buit: aquí anirà el formulari -->
      </section>

      <section id="seccioRegistre" style="margin-top: 20px;">
        <button id="btnMostrarTaula">Mostrar taula</button>

        <table id="taulaCartes" style="display: none; margin-top: 15px; width: 100%;">
          <thead>
            <tr>
              <th>ID</th>
              <th>Remitent</th>
              <th>Destinatari</th>
              <th>Contingut</th>
              <th>Eliminar</th>
              <th>Actualizar</th>
            </tr>
          </thead>
          <tbody id="cosTaula">
            <!-- Las filas se rellenarán con JavaScript -->
          </tbody>
        </table>
      </section>
    </main>
    <div class="botons-accions">
      <button id="btnAfegir">Afegir carta de prova</button>
      <button id="btnSaluda">Saluda'm</button>
    </div>
  </div>

  <div class="footerSection">
    <footer>
      <p>&copy; 2026 El Cartero Invisible</p>
    </footer>
  </div>

  <!-- Modal emergente para editar -->
  <div id="modalEditar" class="modal" style="display: none;">
    <div class="modal-contenido">
      <span id="btnCerrarModal" class="cerrar">&times;</span>
      <h2>Editar Carta</h2>

      <form id="formEditarCarta">
        <!-- IDs adaptados a tu JS -->
        <input type="hidden" id="editId">

        <label for="editRemitent">Remitente:</label>
        <input type="text" id="editRemitent" required>

        <label for="editDestinatari">Destinatario:</label>
        <input type="text" id="editDestinatari" required>

        <label for="editContingut">Contenido:</label>
        <textarea id="editContingut" required></textarea>

        <button type="submit">Guardar Cambios</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/scripts.js"></script>
</body>

</html>
